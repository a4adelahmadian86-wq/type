name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, dom, zip
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: find app config routes database -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php artisan route:list --no-ansi
